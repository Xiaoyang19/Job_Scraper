name: Priority Employer Digest

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "One-time backfill: fetch last 30 days of priority-employer LinkedIn"
        required: false
        type: boolean
        default: false

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false
  
# Ctrl + /
# on:
#   schedule:
#     # 03:13 UTC ≈ 8 PM PDT (UTC-7); in PST (UTC-8) ~7 PM PT.
#     # Off-hour minute (:13) avoids GitHub Actions throttling at :00.
#     - cron: "13 3 * * *"

#   workflow_dispatch:
#     inputs:
#       backfill:
#         description: "One-time backfill: fetch last 30 days of priority-employer LinkedIn instead of 24h (run once when setting up)"
#         required: false
#         type: boolean
#         default: false

# concurrency:
#   group: job-scraper-commit-push
#   cancel-in-progress: false

jobs:
  scrape:
    name: Scrape priority-employer listings
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper (priority-employer LinkedIn, last 24h, or 30-day backfill)
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python scrape_jobs.py --priority-backfill
          else
            python scrape_jobs.py --priority-only
          fi
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          NOTIFY_MIN_FIT: ${{ vars.NOTIFY_MIN_FIT }}

      - name: Export JSON results to CSV
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          def export_csv(json_file, csv_file):
              json_path = Path(json_file)
              csv_path = Path(csv_file)

              if not json_path.exists():
                  print(f"Skipped: {json_path} does not exist")
                  return

              with json_path.open("r", encoding="utf-8") as f:
                  data = json.load(f)

              jobs = data.get("jobs", [])

              # Keep every job-level column found anywhere in the JSON
              columns = []
              seen = set()

              for job in jobs:
                  for key in job.keys():
                      if key not in seen:
                          seen.add(key)
                          columns.append(key)

              if not columns:
                  columns = [
                      "company",
                      "title",
                      "location",
                      "url",
                      "date_posted",
                      "salary",
                      "ats",
                  ]

              # Sort by company, then title
              jobs = sorted(
                  jobs,
                  key=lambda j: (
                      (j.get("company") or "").casefold(),
                      (j.get("title") or "").casefold(),
                  ),
              )

              with csv_path.open(
                  "w",
                  newline="",
                  encoding="utf-8-sig"
              ) as f:
                  writer = csv.DictWriter(
                      f,
                      fieldnames=columns,
                      extrasaction="ignore"
                  )
                  writer.writeheader()

                  for job in jobs:
                      row = {}

                      for column in columns:
                          value = job.get(column, "")

                          if isinstance(value, (list, dict)):
                              value = json.dumps(
                                  value,
                                  ensure_ascii=False
                              )

                          row[column] = value

                      writer.writerow(row)

              print(
                  f"Created {csv_path}: "
                  f"{len(jobs)} jobs, "
                  f"{len(columns)} columns"
              )

          export_csv(
              "output/jobs.json",
              "output/jobs.csv"
          )

          export_csv(
              "output/all_jobs.json",
              "output/all_jobs.csv"
          )
          PY


      - name: Record workflow run
        run: |
          python - <<'EOF'
          import json
          import os
          from datetime import datetime, timezone

          with open("output/jobs.json", encoding="utf-8") as f:
              data = json.load(f)

          entry = {
              "workflow": "biotech",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "job_count": int(data.get("total", 0)),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }

          with open("output/workflow_runs.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps(entry, sort_keys=True) + "\n")
          EOF

      - name: Commit results to repo
        if: vars.ENABLE_DATA_COMMITS == 'true'
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          
          git add -f \
              output/jobs.json \
              output/jobs.csv \
              output/jobs.md \
              output/jobs.html \
              output/all_jobs.json \
              output/all_jobs.csv \
              output/workflow_runs.jsonl \
              output/notified.json
          
          git diff --cached --quiet || git commit -m "chore: update job listings [$(date -u '+%Y-%m-%d')]"
          git pull --rebase -X ours origin main
          git push
